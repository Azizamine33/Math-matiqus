<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôles de 6ème - Mathématiques</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e3c72; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .retour-btn { background-color: white; color: #1e3c72; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 5px; margin-bottom: 20px; transition: background-color 0.2s, transform 0.1s; }
        .retour-btn:hover { background-color: #f0f0f0; transform: translateY(-2px); }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-family: 'UnifrakturMaguntia', cursive, serif; font-size: 4rem; margin: 0; text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5); }
        header p { font-size: 1.2rem; opacity: 0.9; margin-top: 10px; }
        .grille-chapitres { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 15px; width: 100%; max-width: 1250px; margin-bottom: 30px; }
        .chapitre-card { background-color: #ffffff; color: #333; padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        .chapitre-titre { font-weight: bold; font-size: 0.9rem; color: #1e3c72; padding-right: 10px; flex: 1; }
        .groupe-boutons { display: flex; gap: 6px; }
        .btn-pdf { background-color: #2a5298; color: white; padding: 7px 9px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 0.8rem; white-space: nowrap; transition: background-color 0.2s, transform 0.1s; }
        .btn-pdf:hover { background-color: #1e3c72; transform: translateY(-2px); }
        .btn-corr { background-color: #27ae60; }
        .btn-corr:hover { background-color: #1e8449; }
        .btn-obj { background-color: #8e44ad; }
        .btn-obj:hover { background-color: #732d91; }
    </style>
</head>
<body>
    <a href="index.html" class="retour-btn">← Retour à l'accueil</a>
    <header>
        <h1>Classe de 3<sup>ème</sup></h1>
        <p>Espace des Contrôles, Corrections et Objectifs</p>
    </header>
    <div class="grille-chapitres">
        <script>
            for (let i = 1; i <= 17; i++) {
                document.write(`
                    <div class="chapitre-card">
                        <span class="chapitre-titre">Contrôle ${i}</span>
                        <div class="groupe-boutons">
                            <a href="#" class="btn-pdf" onclick="verifierCode('doccontr/3_controle${i}.pdf')">📋 Contrôle</a>
                            <a href="#" class="btn-pdf btn-corr" onclick="verifierCode('doccontrole/3_correction${i}.pdf')">✅ Correction</a>
                            <a href="#" class="btn-pdf btn-obj" onclick="verifierCode('doccontrole/3_objectifs${i}.pdf')">🎯 Objectifs</a>
                        </div>
                    </div>
                `);
            }
        </script>
    </div>
</body>
<script>
    function verifierCode(urlPdf) {
        var motDePasseSecret = "college2026"; 
        var saisie = prompt("Veuillez entrer le code d'accès fourni par votre professeur :");

        if (saisie === motDePasseSecret) {
            window.open(urlPdf, '_self');
        } else if (saisie === null) {
            return;
        } else {
            alert("Code incorrect. Demandez le code à votre professeur.");
        }
    }
</script>
</html>
