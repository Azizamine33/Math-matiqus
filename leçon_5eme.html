<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leçons de 5ème - Mathématiques</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; background-color: #34495e; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .retour-btn { background-color: white; color: #34495e; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 5px; margin-bottom: 20px; transition: background-color 0.2s, transform 0.1s; }
        .retour-btn:hover { background-color: #f0f0f0; transform: translateY(-2px); }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-family: 'UnifrakturMaguntia', cursive, serif; font-size: 4rem; margin: 0; text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5); }
        header p { font-size: 1.2rem; opacity: 0.9; margin-top: 10px; }
        .grille-chapitres { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 15px; width: 100%; max-width: 1200px; margin-bottom: 30px; }
        .chapitre-card { background-color: #ffffff; color: #333; padding: 18px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        .chapitre-titre { font-weight: bold; font-size: 0.95rem; color: #34495e; padding-right: 10px; flex: 1; }
        .btn-pdf { background-color: #34495e; color: white; padding: 8px 12px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 0.85rem; white-space: nowrap; transition: background-color 0.2s, transform 0.1s; }
        .btn-pdf:hover { background-color: #2c3e50; transform: translateY(-2px); }
    </style>
</head>
<body>
    <a href="index.html" class="retour-btn">← Retour à l'accueil</a>
    <header>
        <h1>Classe de 5<sup>ème</sup></h1>
        <p>Espace des Leçons de Mathématiques (17 Chapitres)</p>
    </header>
    <div class="grille-chapitres">
        <!-- 17 chapitres prêts à être renommés -->
        <script>
            for (let i = 1; i <= 17; i++) {
                document.write(`
                    <div class="chapitre-card">
                        <span class="chapitre-titre">Chapitre ${i} : Leçon</span>
                        <a href="#" class="btn-pdf" onclick="verifierCode('docs/5eme_ch${i}_lecon.pdf')">📄 Ouvrir</a>
                    </div>
                `);
            }
        </script>
    </div>
</body>
<script>
    function verifierCode(urlPdf) {
        var motDePasseSecret = "college2026"; 
        var saisie = prompt("Veuillez entrer le code d'accès fourni par votre professeur :");
        if (saisie === motDePasseSecret) { window.open(urlPdf, '_blank'); }
        else if (saisie !== null) { alert("Code incorrect."); }
    }
</script>
</html>
